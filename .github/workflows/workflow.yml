name: Publish to GitHub Packages

# Pushing a tag like 1.0.0-beta.1 packs the fork's TimeWarp.Roslynk tool at that version and publishes it to
# the TimeWarpEngineering GitHub Packages feed (private package), after the full test suite passes. Tag name
# is the package version (no "v" prefix). Authentication is this run's GITHUB_TOKEN (packages: write); no
# stored key. Nothing is published to nuget.org: the upstream Roslynk package there belongs to Peter Morris.
# A pull request into a feature/** branch (the ganda audit's required trigger) runs the tests only: deriving
# the version, packing and pushing are gated to tag builds.
on:
  push:
    tags:
      - "[0-9]*"

  pull_request:
    branches: ['feature/**']
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Source/Morris.Roslynk.slnx --configuration Release

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          dotnet pack Source/App/Morris.Roslynk.Cli/Morris.Roslynk.Cli.csproj
          --configuration Release
          -p:Version=$VERSION
          --output ./nupkgs

      - name: Push to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/TimeWarpEngineering/index.json
          --skip-duplicate
